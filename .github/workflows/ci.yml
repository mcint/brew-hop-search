name: CI

# Every branch, every PR: dev and feat/* are tested, not only main
# (docs/meta/BRANCH-MODEL.md § Workflows).
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    # Homebrew runs on macOS and Linux (Linuxbrew); test both, floor and
    # newest stable Python on each.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
        python-version: ["3.9", "3.15"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}
      - name: Install
        run: uv sync --python ${{ matrix.python-version }}
      - name: Smoke test
        run: |
          uv run brew-hop-search --help
          uv run python -c "from brew_hop_search import __version__; print(__version__)"
      - name: Run tests
        run: uv run python -m pytest tests/ -v
      # GitHub's Ubuntu images ship Homebrew at /home/linuxbrew/.linuxbrew,
      # off PATH, with nothing installed. Install one small formula so -i and
      # -O have something real to read: index fetch, installed, outdated.
      - name: Linuxbrew smoke
        if: runner.os == 'Linux' && matrix.python-version == '3.15'
        run: |
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          brew --version
          brew install --quiet hello
          uv run brew-hop-search python -n3
          uv run brew-hop-search -i hello
          uv run brew-hop-search -i -g hello | grep -qP '^hello\t'
          uv run brew-hop-search -O -q
